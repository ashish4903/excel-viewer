# Lints, tests and builds the app and checks dependencies for known vulnerabilities
# on every push and pull request, and deploys it to GitHub Pages on every push to main.
# When main has a version that has not been released yet, it also creates the GitHub Release.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# On pull requests a newer push cancels the run still in progress; deploys to main always finish.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Jobs only get read access to the code unless they ask for more (deploy does, below).
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - name: Check CHANGELOG.md has an entry for this version
        run: node scripts/release-notes.js > /dev/null
      - run: npm run lint
      - run: npm test
      - run: npm run build

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  # Fails when a dependency has a known high or critical vulnerability.
  # Kept separate from build and not a required check: a new advisory can appear any day,
  # and it shouldn't block unrelated pull requests. Dependabot opens the fix PRs.
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - run: npm audit --audit-level=high

  deploy:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  # Tags the commit and publishes a GitHub Release when package.json has a new version, using that
  # version's CHANGELOG.md section as the notes. Does nothing if the version is already released.
  release:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Create the release if this version is new
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "require('./package.json').version")
          if gh release view "v$version" > /dev/null 2>&1; then
            echo "v$version is already released."
          else
            node scripts/release-notes.js > notes.md
            gh release create "v$version" --target "$GITHUB_SHA" --title "v$version" --notes-file notes.md
          fi
