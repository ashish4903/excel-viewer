# Lints, tests and builds the app and checks dependencies for known vulnerabilities
# on every push and pull request, and deploys it to GitHub Pages on every push to main.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# On pull requests a newer push cancels the run still in progress; deploys to main always finish.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  # Fails when a dependency has a known high or critical vulnerability.
  # Kept separate from build and not a required check: a new advisory can appear any day,
  # and it shouldn't block unrelated pull requests. Dependabot opens the fix PRs.
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - run: npm audit --audit-level=high

  deploy:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
